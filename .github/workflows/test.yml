name: test
on:
  push:
    branches-ignore: ["wip/*"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Before setup-node, otherwise `cache: pnpm` has no pnpm to find.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: pnpm
      - name: Install modules
        run: pnpm install --frozen-lockfile
      - name: Run linter
        run: pnpm lint
      - name: Create next-env.d.ts for type checking
        run: pnpm next typegen
      - name: Compile Typescript code and check for errors
        run: pnpm tsc
      - name: Run tests
        run: pnpm test
      - name: Build static export
        run: pnpm build
